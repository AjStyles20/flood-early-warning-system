services:
  floodwatch-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${FLOODWATCH_MYSQL_DATABASE:-floodwatch}
      MYSQL_USER: ${FLOODWATCH_MYSQL_USER:-floodwatch_app}
      MYSQL_PASSWORD: ${FLOODWATCH_MYSQL_PASSWORD:-floodwatch_dev}
      MYSQL_ROOT_PASSWORD: ${FLOODWATCH_MYSQL_ROOT_PASSWORD:-floodwatch_root_dev}
    volumes:
      - floodwatch_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${FLOODWATCH_MYSQL_USER:-floodwatch_app}", "-p${FLOODWATCH_MYSQL_PASSWORD:-floodwatch_dev}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  floodwatch-api:
    build: .
    depends_on:
      floodwatch-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      FLOOD_EWS_DATABASE_URL: mysql+pymysql://${FLOODWATCH_MYSQL_USER:-floodwatch_app}:${FLOODWATCH_MYSQL_PASSWORD:-floodwatch_dev}@floodwatch-db:3306/${FLOODWATCH_MYSQL_DATABASE:-floodwatch}
      FLOOD_EWS_RUNTIME_DIR: /app/runtime
      FLOOD_EWS_INGEST_TOKEN: ${FLOOD_EWS_INGEST_TOKEN:-}
      FLOOD_EWS_NEWS_PROVIDER: ${FLOOD_EWS_NEWS_PROVIDER:-auto}
      FLOOD_EWS_NEWSAPI_KEY: ${FLOOD_EWS_NEWSAPI_KEY:-}
      FLOOD_EWS_GNEWS_API_KEY: ${FLOOD_EWS_GNEWS_API_KEY:-}
      FLOOD_EWS_RSS_FEEDS: ${FLOOD_EWS_RSS_FEEDS:-}
      FLOODWATCH_CONTACT_EMAIL: ${FLOODWATCH_CONTACT_EMAIL:-}
      FLOOD_EWS_EMAILJS_PUBLIC_KEY: ${FLOOD_EWS_EMAILJS_PUBLIC_KEY:-}
      FLOOD_EWS_EMAILJS_SERVICE_ID: ${FLOOD_EWS_EMAILJS_SERVICE_ID:-}
      FLOOD_EWS_EMAILJS_CONTACT_TEMPLATE_ID: ${FLOOD_EWS_EMAILJS_CONTACT_TEMPLATE_ID:-}
      FLOOD_EWS_NEWS_QUERY: ${FLOOD_EWS_NEWS_QUERY:-flood OR rainfall Nigeria}
      FLOOD_EWS_NEWS_LANGUAGE: ${FLOOD_EWS_NEWS_LANGUAGE:-en}
      FLOOD_EWS_NEWS_COUNTRY: ${FLOOD_EWS_NEWS_COUNTRY:-}
      FLOOD_EWS_SECURE_COOKIES: ${FLOOD_EWS_SECURE_COOKIES:-0}
    volumes:
      - floodwatch_runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  floodwatch_mysql_data:
  floodwatch_runtime:
