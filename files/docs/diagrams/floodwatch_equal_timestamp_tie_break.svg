<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Deterministic Latest-Reading Tie Semantics</text>
<rect class="box" x="55" y="90" width="250" height="135" rx="8"/><text x="98" y="120" class="h">Same Station + Timestamp</text><text x="90" y="150" class="b">Reading A: hardware, persisted first</text><text x="90" y="172" class="b">Reading B: simulated, persisted later</text><text x="90" y="194" class="b">timestamp alone cannot choose</text>
<rect class="box" x="390" y="80" width="260" height="155" rx="8"/><text x="440" y="110" class="h">Deterministic Ordering</text><text x="430" y="140" class="b">1. newest timestamp</text><text x="430" y="162" class="b">2. highest persistence id</text><text x="430" y="184" class="b">later persisted stage wins tie</text><text x="430" y="206" class="b">mirrors legacy compatibility rule</text>
<rect class="box" x="735" y="95" width="200" height="125" rx="8"/><text x="775" y="125" class="h">Normalized Read</text><text x="770" y="155" class="b">latest_per_station</text><text x="770" y="177" class="b">stable across runs</text><text x="770" y="199" class="b">source-independent</text>
<rect class="gate" x="1005" y="105" width="160" height="105" rx="8"/><text x="1040" y="135" class="h">Parity Gate</text><text x="1030" y="165" class="b">legacy = normalized</text><text x="1042" y="187" class="b">CI PASS</text>
<path class="line" d="M305 157 H390"/><path class="line" d="M650 157 H735"/><path class="line" d="M935 157 H1005"/>
<rect class="gate" x="390" y="330" width="775" height="75" rx="8"/><text x="430" y="360" class="h">Why it matters before DB-5</text><text x="430" y="385" class="b">Without an explicit tie-breaker, equal timestamps could select different sources after migration even though ordinary non-tie parity tests passed.</text>
<text x="35" y="460" class="b">This is data-selection determinism, not a hydrological rule. It preserves migration semantics when timestamps are equal.</text></svg>