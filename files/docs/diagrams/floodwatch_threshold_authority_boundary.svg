<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.guard{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.blocked{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Threshold Authority Boundary</text>
<rect class="box" x="55" y="90" width="245" height="135" rx="8"/><text x="100" y="120" class="h">Generic Telemetry Input</text><text x="90" y="150" class="b">sensor / simulator payload</text><text x="90" y="172" class="b">threshold value + supplied label</text><text x="90" y="194" class="b">not an authority credential</text>
<rect class="guard" x="390" y="80" width="275" height="155" rx="8"/><text x="440" y="110" class="h">Normalization Guard</text><text x="430" y="140" class="b">prototype_demo → preserved</text><text x="430" y="162" class="b">research_statistical → compatibility label</text><text x="430" y="184" class="b">official_operational → downgraded</text><text x="430" y="206" class="b">explicit provenance recorded</text>
<rect class="box" x="755" y="95" width="190" height="125" rx="8"/><text x="790" y="125" class="h">Threshold Store</text><text x="785" y="155" class="b">typed configuration</text><text x="785" y="177" class="b">source_reference</text><text x="785" y="199" class="b">no false authority</text>
<rect class="blocked" x="1010" y="105" width="160" height="105" rx="8"/><text x="1032" y="135" class="h">Official Claim</text><text x="1030" y="165" class="b">requires separate</text><text x="1028" y="187" class="b">verified authority path</text>
<path class="line" d="M300 157 H390"/><path class="line" d="M665 157 H755"/><path class="line" d="M945 157 H1010"/>
<rect class="guard" x="390" y="335" width="780" height="70" rx="8"/><text x="430" y="365" class="h">Safety / scientific-integrity rule</text><text x="430" y="389" class="b">A client-provided string cannot promote prototype telemetry into an official operational hydrological threshold.</text>
<text x="35" y="460" class="b">This closes the generic-ingestion authority gap; an authenticated authoritative threshold-import workflow remains a separate future capability.</text></svg>