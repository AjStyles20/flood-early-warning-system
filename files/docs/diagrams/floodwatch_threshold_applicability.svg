<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Typed Threshold Configuration and Applicability</text>
<rect class="box" x="55" y="100" width="220" height="120" rx="8"/><text x="92" y="130" class="h">Validated Threshold Input</text><text x="85" y="157" class="b">value + threshold_type</text><text x="78" y="177" class="b">station + river-stage variable</text><text x="78" y="197" class="b">explicit source/provenance</text>
<rect class="box" x="350" y="90" width="235" height="145" rx="8"/><text x="405" y="120" class="h">Threshold Entity</text><text x="385" y="147" class="b">official_operational OR</text><text x="385" y="167" class="b">research_statistical OR</text><text x="385" y="187" class="b">prototype_demo</text><text x="385" y="207" class="b">valid_from / valid_to / active</text>
<rect class="box" x="665" y="90" width="220" height="145" rx="8"/><text x="704" y="120" class="h">Applicability Query</text><text x="700" y="147" class="b">same station</text><text x="700" y="167" class="b">same variable</text><text x="700" y="187" class="b">active + validity window</text><text x="700" y="207" class="b">no invented fallback</text>
<rect class="box" x="965" y="100" width="180" height="120" rx="8"/><text x="1003" y="130" class="h">Current Evidence</text><text x="993" y="157" class="b">stage Observation</text><text x="993" y="177" class="b">+ applicable Threshold</text><text x="993" y="197" class="b">kept semantically distinct</text>
<path class="line" d="M275 160 H350"/><path class="line" d="M585 160 H665"/><path class="line" d="M885 160 H965"/>
<rect class="gate" x="350" y="330" width="535" height="120" rx="8"/><text x="390" y="360" class="h">Compatibility provenance rule</text><text x="390" y="387" class="b">Legacy danger_level_m is normalized as Threshold configuration, never Observation.</text><text x="390" y="407" class="b">Its source explicitly states compatibility-derived and not independently verified as official.</text><text x="390" y="427" class="b">Identical active compatibility thresholds are reused instead of duplicated per reading.</text>
<path class="line" d="M470 235 V330"/>
<text x="35" y="530" class="b">An official-operational threshold must eventually carry authoritative source evidence; a prototype-demo threshold cannot become official merely by being used repeatedly.</text></svg>