<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.guard{fill:#f8f9f9;stroke:#7b241c;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Threshold Evidence Authority Boundary</text>
<rect class="box" x="50" y="105" width="250" height="125" rx="8"/><text x="85" y="137" class="h">Generic Telemetry Ingestion</text><text x="80" y="165" class="b">sensor/simulator reading</text><text x="80" y="187" class="b">caller may supply threshold label</text><text x="80" y="209" class="b">not an evidence-authority channel</text>
<rect class="guard" x="395" y="90" width="360" height="155" rx="8"/><text x="440" y="122" class="h">Provenance Guard</text><text x="430" y="150" class="b">official_operational → prototype_demo</text><text x="430" y="174" class="b">research_statistical → prototype_demo</text><text x="430" y="198" class="b">prototype_demo → prototype_demo</text><text x="430" y="222" class="b">retain provenance explanation</text>
<rect class="box" x="850" y="105" width="280" height="125" rx="8"/><text x="900" y="137" class="h">Normalized Threshold</text><text x="885" y="165" class="b">safe compatibility configuration</text><text x="885" y="187" class="b">no false official/research authority</text><text x="885" y="209" class="b">historical validity retained</text>
<path class="line" d="M300 168 H395"/><path class="line" d="M755 168 H850"/>
<rect class="box" x="395" y="320" width="360" height="80" rx="8"/><text x="445" y="350" class="h">Separate provenance-controlled workflow</text><text x="430" y="377" class="b">required before official or research-statistical threshold evidence is promoted</text>
<path class="line" d="M575 245 V320"/><text x="35" y="445" class="b">Authority labels are evidence claims. Generic telemetry may carry a value for compatibility, but cannot establish who authorized or derived that threshold.</text></svg>