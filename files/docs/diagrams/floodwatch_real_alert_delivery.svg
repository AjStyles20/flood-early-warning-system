<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="470" viewBox="0 0 1250 470"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Real Alert Delivery Architecture</text><rect class="box" x="40" y="115" width="210" height="110" rx="8"/><text x="85" y="145" class="h">Risk Assessment</text><text x="75" y="175" class="b">alert-worthy state</text><text x="75" y="197" class="b">safe advisory message</text><rect class="box" x="335" y="95" width="270" height="150" rx="8"/><text x="390" y="125" class="h">Delivery Orchestrator</text><text x="375" y="155" class="b">web = available</text><text x="375" y="179" class="b">EmailJS adapter</text><text x="375" y="203" class="b">Twilio SMS adapter</text><text x="375" y="227" class="b">no provider secret in Git</text><rect class="box" x="690" y="70" width="215" height="100" rx="8"/><text x="755" y="100" class="h">EmailJS</text><text x="730" y="130" class="b">configured → send</text><text x="730" y="152" class="b">sent / failed</text><rect class="box" x="690" y="230" width="215" height="100" rx="8"/><text x="755" y="260" class="h">Twilio SMS</text><text x="730" y="290" class="b">configured → send</text><text x="730" y="312" class="b">sent / failed</text><rect class="box" x="990" y="115" width="220" height="120" rx="8"/><text x="1035" y="145" class="h">Persistent Alert</text><text x="1025" y="175" class="b">channel outcomes</text><text x="1025" y="197" class="b">operator workflow/audit</text><text x="1025" y="219" class="b">not_configured is explicit</text><path class="line" d="M250 170 H335"/><path class="line" d="M605 145 H650 V120 H690"/><path class="line" d="M605 195 H650 V280 H690"/><path class="line" d="M905 120 H950 V170 H990"/><path class="line" d="M905 280 H950 V190 H990"/><text x="35" y="420" class="b">Provider integration is executable; real delivery becomes evidenced only after local credentials/recipient configuration and a successful live test.</text></svg>