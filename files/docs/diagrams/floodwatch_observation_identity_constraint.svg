<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.bad{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Observation Identity: Application + Database Enforcement</text>
<rect class="box" x="55" y="90" width="250" height="130" rx="8"/><text x="95" y="120" class="h">Evidence Identity</text><text x="90" y="150" class="b">station_id + variable_id</text><text x="90" y="172" class="b">+ source_id + observed_at</text><text x="90" y="194" class="b">one normalized evidence slot</text>
<rect class="gate" x="390" y="70" width="270" height="145" rx="8"/><text x="430" y="100" class="h">Application Policy</text><text x="425" y="130" class="b">exact replay → reuse</text><text x="425" y="152" class="b">different content → reject</text><text x="425" y="174" class="b">provides semantic explanation</text><text x="425" y="196" class="b">before persistence</text>
<rect class="gate" x="745" y="70" width="250" height="145" rx="8"/><text x="790" y="100" class="h">Database Constraint</text><text x="780" y="130" class="b">UNIQUE composite identity</text><text x="780" y="152" class="b">protects bypass/concurrency</text><text x="780" y="174" class="b">SQLite + MySQL</text><text x="780" y="196" class="b">integrity backstop</text>
<rect class="bad" x="1040" y="95" width="130" height="105" rx="8"/><text x="1065" y="125" class="h">Duplicate</text><text x="1060" y="155" class="b">direct insert</text><text x="1065" y="177" class="b">REJECTED</text>
<path class="line" d="M305 150 H390"/><path class="line" d="M660 150 H745"/><path class="line" d="M995 150 H1040"/>
<rect class="gate" x="390" y="330" width="780" height="75" rx="8"/><text x="430" y="360" class="h">Defense in depth</text><text x="430" y="385" class="b">The application decides replay vs conflict; the DB guarantees that no bypass path can persist two rows with the same evidence identity.</text>
<text x="35" y="460" class="b">First CI exposed a missing SQLAlchemy import before tests could start; the import was corrected and the full SQLite/MySQL suite then passed.</text></svg>