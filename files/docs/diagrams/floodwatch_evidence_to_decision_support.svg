<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.grp{fill:#f8f9f9;stroke:#aeb6bf;stroke-width:1.5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Evidence-to-Decision-Support Architecture</text>
<rect class="grp" x="30" y="70" width="1140" height="500" rx="12"/>
<text x="55" y="105" class="h">Observation and evidence</text>
<rect class="box" x="55" y="130" width="180" height="70" rx="8"/><text x="85" y="160" class="b">Physical monitoring</text><text x="95" y="179" class="b">node / stage-like input</text>
<rect class="box" x="55" y="230" width="180" height="70" rx="8"/><text x="93" y="260" class="b">Historical / external</text><text x="93" y="279" class="b">hydrological evidence</text>
<rect class="box" x="55" y="330" width="180" height="70" rx="8"/><text x="96" y="360" class="b">Controlled simulator</text><text x="94" y="379" class="b">development evidence</text>
<rect class="box" x="310" y="205" width="190" height="110" rx="8"/><text x="345" y="235" class="h">Provenance Layer</text><text x="335" y="260" class="b">source + variable + time</text><text x="335" y="280" class="b">quality / evidence type</text><text x="335" y="300" class="b">no fabricated variables</text>
<rect class="box" x="575" y="125" width="190" height="110" rx="8"/><text x="608" y="155" class="h">Monitoring Plane</text><text x="600" y="180" class="b">current-state assessment</text><text x="610" y="200" class="b">interpretable threshold</text>
<rect class="box" x="575" y="315" width="190" height="110" rx="8"/><text x="620" y="345" class="h">Research Plane</text><text x="600" y="370" class="b">B3 interpretable baseline</text><text x="614" y="390" class="b">vs lightweight ML</text><text x="610" y="410" class="b">evaluation + gate</text>
<rect class="box" x="840" y="205" width="220" height="120" rx="8"/><text x="880" y="235" class="h">Decision Support</text><text x="870" y="260" class="b">technical state + provenance</text><text x="875" y="280" class="b">plain-language explanation</text><text x="875" y="300" class="b">accessible/localized output</text>
<rect class="box" x="840" y="390" width="220" height="95" rx="8"/><text x="887" y="420" class="h">Dissemination</text><text x="875" y="445" class="b">web available; email/SMS</text><text x="902" y="465" class="b">simulated until tested</text>
<path class="line" d="M235 165 H270 V250 H310"/><path class="line" d="M235 265 H310"/><path class="line" d="M235 365 H270 V280 H310"/><path class="line" d="M500 240 H540 V180 H575"/><path class="line" d="M500 280 H540 V370 H575"/><path class="line" d="M765 180 H800 V250 H840"/><path class="line" d="M765 370 H800 V300 H840"/><path class="line" d="M950 325 V390"/>
<text x="35" y="615" class="b">Research output reaches operational decision support only after its evidence/promotion gate; the prototype does not replace official emergency authority.</text></svg>