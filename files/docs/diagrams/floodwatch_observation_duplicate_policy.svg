<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.pass{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.reject{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Normalized Observation Duplicate / Correction Policy</text>
<rect class="box" x="55" y="90" width="260" height="135" rx="8"/><text x="100" y="120" class="h">Incoming Observation</text><text x="90" y="150" class="b">station + variable + source</text><text x="90" y="172" class="b">+ observed_at identity</text><text x="90" y="194" class="b">value + metadata evidence</text>
<rect class="pass" x="400" y="70" width="270" height="120" rx="8"/><text x="445" y="100" class="h">Exact Existing Evidence</text><text x="440" y="130" class="b">same value + quality + signal</text><text x="440" y="152" class="b">→ return existing row</text><text x="440" y="174" class="b">idempotent replay</text>
<rect class="reject" x="400" y="235" width="270" height="120" rx="8"/><text x="435" y="265" class="h">Conflicting Existing Evidence</text><text x="440" y="295" class="b">same identity, different content</text><text x="440" y="317" class="b">→ reject write</text><text x="440" y="339" class="b">explicit correction required</text>
<rect class="box" x="770" y="115" width="220" height="125" rx="8"/><text x="815" y="145" class="h">Normalized Store</text><text x="805" y="175" class="b">no silent duplicate</text><text x="805" y="197" class="b">no silent overwrite</text><text x="805" y="219" class="b">evidence preserved</text>
<path class="line" d="M315 157 H365 V130 H400"/><path class="line" d="M365 157 V295 H400"/><path class="line" d="M670 130 H770"/><path class="line" d="M670 295 H720 V205 H770"/>
<rect class="pass" x="770" y="325" width="400" height="80" rx="8"/><text x="810" y="355" class="h">Current policy scope</text><text x="810" y="380" class="b">Transport retry safety is implemented. Scientific/authoritative revisions require a future explicit versioned correction workflow.</text>
<text x="35" y="470" class="b">Identity is station + variable + source + observed timestamp. The policy is application-enforced while correction semantics remain deliberately explicit.</text></svg>