<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Temporal Threshold Change-Point Semantics</text>
<rect class="box" x="55" y="95" width="245" height="125" rx="8"/><text x="95" y="125" class="h">Threshold A = 2.0 m</text><text x="88" y="155" class="b">valid_from: t0</text><text x="88" y="177" class="b">valid_to: t1 − 1 microsecond</text><text x="88" y="199" class="b">historical observations retain A</text>
<rect class="box" x="390" y="95" width="245" height="125" rx="8"/><text x="430" y="125" class="h">Change Point at t1</text><text x="425" y="155" class="b">incoming threshold = 2.5 m</text><text x="425" y="177" class="b">close prior open interval</text><text x="425" y="199" class="b">open replacement at t1</text>
<rect class="box" x="725" y="95" width="245" height="125" rx="8"/><text x="765" y="125" class="h">Threshold B = 2.5 m</text><text x="758" y="155" class="b">valid_from: t1</text><text x="758" y="177" class="b">valid_to: open</text><text x="758" y="199" class="b">current/future observations use B</text>
<path class="line" d="M300 157 H390"/><path class="line" d="M635 157 H725"/>
<rect class="gate" x="390" y="330" width="780" height="85" rx="8"/><text x="430" y="360" class="h">Historical reconstruction rule</text><text x="430" y="385" class="b">applicable_threshold(observed_at) resolves the configuration valid at that observation time; a later threshold change does not rewrite history.</text>
<text x="35" y="470" class="b">Compatibility change points require chronological ingestion. CI exposed SQLite aware/naive datetime differences; comparison/test handling was corrected before PASS.</text></svg>