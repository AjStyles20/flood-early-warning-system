<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Telemetry Application-Service Boundary</text>
<rect class="box" x="45" y="95" width="205" height="135" rx="8"/><text x="95" y="125" class="h">FastAPI Routes</text><text x="75" y="153" class="b">validate transport input</text><text x="75" y="173" class="b">HTTP auth / status codes</text><text x="75" y="193" class="b">REST + CSV adapters</text><text x="75" y="213" class="b">thin orchestration call</text>
<rect class="box" x="330" y="75" width="235" height="175" rx="8"/><text x="370" y="105" class="h">Telemetry Service</text><text x="365" y="133" class="b">ingest workflow</text><text x="365" y="153" class="b">immediate threshold assessment</text><text x="365" y="173" class="b">notification / alert orchestration</text><text x="365" y="193" class="b">normalized risk-status workflow</text><text x="365" y="213" class="b">hybrid selection policy</text><text x="365" y="233" class="b">no SQL ownership</text>
<rect class="box" x="650" y="70" width="220" height="100" rx="8"/><text x="695" y="100" class="h">Repositories</text><text x="680" y="128" class="b">legacy + normalized reads</text><text x="680" y="148" class="b">atomic persistence boundary</text>
<rect class="box" x="650" y="220" width="220" height="100" rx="8"/><text x="692" y="250" class="h">Domain Services</text><text x="680" y="278" class="b">normalized current state</text><text x="680" y="298" class="b">risk engine / ML boundary</text>
<rect class="box" x="955" y="135" width="195" height="120" rx="8"/><text x="997" y="165" class="h">Persistence / Output</text><text x="985" y="193" class="b">MySQL normalized model</text><text x="985" y="213" class="b">legacy rollback store</text><text x="985" y="233" class="b">RiskStatus / alerts</text>
<path class="line" d="M250 162 H330"/><path class="line" d="M565 135 H650"/><path class="line" d="M565 205 H610 V270 H650"/><path class="line" d="M870 120 H910 V185 H955"/><path class="line" d="M870 270 H910 V215 H955"/>
<rect class="gate" x="330" y="395" width="820" height="85" rx="8"/><text x="365" y="425" class="h">Design rule</text><text x="365" y="450" class="b">Routes own HTTP concerns; services own use-case orchestration; repositories own persistence; domain services own interpretation. This reduces main.py coupling without changing the public contract.</text>
<text x="35" y="535" class="b">The refactor is structural engineering work only; it does not change hydrological evidence, thresholds, or research-model claims.</text></svg>