<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}</style><text x="35" y="35" class="t">FloodWatch DB-3 Controlled Telemetry Dual-Write</text>
<rect class="box" x="50" y="100" width="190" height="100" rx="8"/><text x="95" y="130" class="h">Validated Input</text><text x="75" y="155" class="b">REST / CSV / Pico bridge</text><text x="80" y="175" class="b">TelemetryCreate contract</text>
<rect class="box" x="310" y="100" width="210" height="100" rx="8"/><text x="350" y="130" class="h">Telemetry Repository</text><text x="340" y="155" class="b">single transaction boundary</text><text x="342" y="175" class="b">commit or rollback together</text>
<rect class="box" x="600" y="75" width="220" height="100" rx="8"/><text x="645" y="105" class="h">Legacy Record</text><text x="632" y="130" class="b">TelemetryRecord</text><text x="625" y="150" class="b">API/dashboard compatibility</text>
<rect class="box" x="600" y="230" width="220" height="130" rx="8"/><text x="635" y="260" class="h">Normalization Adapter</text><text x="625" y="285" class="b">station + source mapping</text><text x="625" y="305" class="b">only present variables mirrored</text><text x="625" y="325" class="b">threshold kept out of Observation</text><text x="625" y="345" class="b">catalogue provenance retained</text>
<rect class="box" x="900" y="230" width="220" height="130" rx="8"/><text x="945" y="260" class="h">Normalized Store</text><text x="930" y="285" class="b">Station + Observation</text><text x="930" y="305" class="b">Variable + DataSource</text><text x="930" y="325" class="b">null inputs create no rows</text>
<path class="line" d="M240 150 H310"/><path class="line" d="M520 140 H600"/><path class="line" d="M520 165 H555 V295 H600"/><path class="line" d="M820 295 H900"/>
<rect class="gate" x="310" y="430" width="810" height="85" rx="8"/><text x="345" y="460" class="h">DB-3 parity protection</text><text x="345" y="485" class="b">If normalized staging fails, the transaction rolls back: the legacy record is not silently committed alone. Legacy reads remain authoritative until DB-4 read parity and physical Pico regression pass.</text>
<path class="line dash" d="M415 200 V430"/>
<text x="35" y="565" class="b">This is a migration/compatibility mechanism, not a claim that prototype telemetry is equivalent to authoritative hydrological field evidence.</text></svg>