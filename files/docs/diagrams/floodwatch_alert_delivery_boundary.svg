<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Alert Delivery Evidence Boundary</text><rect class="box" x="55" y="115" width="230" height="115" rx="8"/><text x="105" y="145" class="h">Risk Assessment</text><text x="90" y="175" class="b">Moderate / High / Severe</text><text x="90" y="197" class="b">decision-support event</text><rect class="box" x="390" y="95" width="330" height="155" rx="8"/><text x="470" y="125" class="h">Alert Workflow</text><text x="435" y="155" class="b">web = available</text><text x="435" y="179" class="b">email = simulated</text><text x="435" y="203" class="b">sms = simulated</text><text x="435" y="227" class="b">persistent operator audit</text><rect class="box" x="825" y="115" width="280" height="115" rx="8"/><text x="880" y="145" class="h">Defense Claim</text><text x="860" y="175" class="b">workflow + simulation demonstrated</text><text x="860" y="197" class="b">no claim of provider delivery</text><path class="line" d="M285 172 H390"/><path class="line" d="M720 172 H825"/><text x="35" y="380" class="b">Real SMS/email delivery requires a configured external provider and delivery evidence; UI/API capability labels must not imply that evidence exists.</text></svg>