<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.bad{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Unified Normalized Observation Write Boundary</text>
<rect class="box" x="55" y="90" width="235" height="120" rx="8"/><text x="95" y="120" class="h">Write Producers</text><text x="85" y="150" class="b">telemetry normalization</text><text x="85" y="172" class="b">observation repository</text><text x="85" y="194" class="b">future import paths</text>
<rect class="gate" x="385" y="75" width="300" height="150" rx="8"/><text x="430" y="105" class="h">Shared Evidence-Write Policy</text><text x="420" y="135" class="b">exact replay → reuse row</text><text x="420" y="157" class="b">conflicting duplicate → reject</text><text x="420" y="179" class="b">dataset/source evidence types → agree</text><text x="420" y="201" class="b">no silent overwrite</text>
<rect class="box" x="785" y="90" width="210" height="120" rx="8"/><text x="825" y="120" class="h">Observation Store</text><text x="820" y="150" class="b">atomic evidence</text><text x="820" y="172" class="b">consistent provenance</text><text x="820" y="194" class="b">idempotent retries</text>
<path class="line" d="M290 150 H385"/><path class="line" d="M685 150 H785"/>
<rect class="bad" x="385" y="320" width="610" height="80" rx="8"/><text x="425" y="350" class="h">Rejected ambiguity</text><text x="425" y="375" class="b">A simulated Dataset cannot be attached to an Observation whose DataSource says observed; a conflicting same-identity value cannot silently pass.</text>
<text x="35" y="460" class="b">The repository and compatibility adapter now converge on one policy boundary instead of implementing different normalized-write semantics.</text></svg>