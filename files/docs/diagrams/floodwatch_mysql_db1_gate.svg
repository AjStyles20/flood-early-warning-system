<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch DB-1 MySQL Execution Gate</text>
<rect class="box" x="55" y="100" width="210" height="115" rx="8"/><text x="95" y="130" class="h">Application Layer</text><text x="82" y="158" class="b">FastAPI + repositories</text><text x="83" y="178" class="b">SQLAlchemy + PyMySQL</text><text x="80" y="198" class="b">FLOOD_EWS_DATABASE_URL</text>
<rect class="box" x="350" y="90" width="220" height="135" rx="8"/><text x="405" y="120" class="h">MySQL 8.4</text><text x="385" y="148" class="b">client/server RDBMS</text><text x="385" y="168" class="b">normalized schema</text><text x="385" y="188" class="b">FK / CHECK / indexes</text><text x="385" y="208" class="b">transaction persistence</text>
<rect class="gate" x="655" y="80" width="250" height="155" rx="8"/><text x="705" y="110" class="h">DB-1 Integration Gate</text><text x="690" y="138" class="b">create schema</text><text x="690" y="158" class="b">atomic dual-write</text><text x="690" y="178" class="b">normalized evidence read</text><text x="690" y="198" class="b">typed threshold + risk state</text><text x="690" y="218" class="b">hardware path has no ML</text>
<rect class="box" x="985" y="105" width="165" height="105" rx="8"/><text x="1022" y="135" class="h">CI Result</text><text x="1015" y="163" class="b">MySQL execution PASS</text><text x="1010" y="183" class="b">disposable CI schema</text>
<path class="line" d="M265 157 H350"/><path class="line" d="M570 157 H655"/><path class="line" d="M905 157 H985"/>
<rect class="gate" x="350" y="350" width="800" height="105" rx="8"/><text x="385" y="380" class="h">Local development / defense environment</text><text x="385" y="407" class="b">docker compose now provisions MySQL + API; MySQL Workbench may connect to a local server separately for inspection/EER/admin.</text><text x="385" y="427" class="b">Credentials remain environment configuration. Physical Pico regression is still required before DB-5 legacy retirement.</text>
<path class="line" d="M460 225 V350"/>
<text x="35" y="525" class="b">CI proves the application executes against a real MySQL server. It does not prove the user's local Workbench/server setup or physical hardware path until those are run locally.</text></svg>