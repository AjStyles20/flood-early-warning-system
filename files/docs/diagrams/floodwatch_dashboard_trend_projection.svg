<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.no{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Dashboard Trend Projection Semantics</text>
<rect class="box" x="55" y="100" width="220" height="120" rx="8"/><text x="95" y="130" class="h">Current Evidence</text><text x="85" y="160" class="b">current river-stage value</text><text x="85" y="182" class="b">previous-reading change</text><text x="85" y="204" class="b">configured threshold</text>
<rect class="gate" x="370" y="90" width="300" height="140" rx="8"/><text x="415" y="120" class="h">Transparent Projection</text><text x="405" y="150" class="b">projected = current + 6 × rate-of-rise</text><text x="405" y="172" class="b">horizon unit = readings</text><text x="405" y="194" class="b">not shaped by risk colour/class</text><text x="405" y="216" class="b">not an ML forecast</text>
<rect class="box" x="765" y="100" width="220" height="120" rx="8"/><text x="805" y="130" class="h">Dashboard Curve</text><text x="795" y="160" class="b">trend projection</text><text x="795" y="182" class="b">danger reference line</text><text x="795" y="204" class="b">+6 readings</text>
<path class="line" d="M275 160 H370"/><path class="line" d="M670 160 H765"/>
<rect class="no" x="370" y="330" width="615" height="80" rx="8"/><text x="410" y="360" class="h">Removed misleading behavior</text><text x="410" y="385" class="b">The previous UI drew an apparent “+6 hours” forecast endpoint from the current risk class even though no hourly forecast produced that curve.</text>
<text x="35" y="460" class="b">This projection is an interpretable visualization of persistence in the latest per-reading change; it is not hydrological predictive validation.</text></svg>