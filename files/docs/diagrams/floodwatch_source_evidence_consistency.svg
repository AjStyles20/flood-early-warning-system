<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.gate{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.bad{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Data-Source Evidence Consistency</text>
<rect class="box" x="60" y="95" width="240" height="125" rx="8"/><text x="105" y="125" class="h">Observed Evidence</text><text x="95" y="155" class="b">evidence_type = observed</text><text x="95" y="177" class="b">is_observational = true</text><text x="95" y="199" class="b">e.g. LOCAL_SENSOR</text>
<rect class="box" x="380" y="95" width="260" height="125" rx="8"/><text x="425" y="125" class="h">Non-observed Evidence</text><text x="420" y="155" class="b">simulated / derived / reanalysis</text><text x="420" y="177" class="b">/ modelled</text><text x="420" y="199" class="b">is_observational = false</text>
<rect class="gate" x="720" y="95" width="210" height="125" rx="8"/><text x="755" y="125" class="h">DB Constraint</text><text x="750" y="155" class="b">type and boolean</text><text x="750" y="177" class="b">must agree</text><text x="750" y="199" class="b">SQLite + MySQL</text>
<rect class="bad" x="1010" y="105" width="160" height="105" rx="8"/><text x="1040" y="135" class="h">Contradiction</text><text x="1030" y="165" class="b">simulated + true</text><text x="1045" y="187" class="b">REJECTED</text>
<path class="line" d="M300 157 H350 V260 H720 V157"/><path class="line" d="M640 157 H720"/><path class="line" d="M930 157 H1010"/>
<rect class="gate" x="380" y="335" width="790" height="70" rx="8"/><text x="420" y="365" class="h">Why it matters</text><text x="420" y="389" class="b">A simulator, reanalysis product, derived variable or model output cannot become observational evidence because one metadata field disagrees with another.</text>
<text x="35" y="460" class="b">This is provenance integrity at the database boundary; it does not certify the scientific quality or calibration of an observational source.</text></svg>