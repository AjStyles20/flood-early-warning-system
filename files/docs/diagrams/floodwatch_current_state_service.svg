<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.grp{fill:#f8f9f9;stroke:#aeb6bf;stroke-width:1.5}.line{stroke:#566573;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}</style><text x="35" y="35" class="t">FloodWatch Current-State Assessment — Service Boundary</text>
<rect class="grp" x="30" y="80" width="1140" height="330" rx="12"/>
<rect class="box" x="65" y="165" width="170" height="85" rx="8"/><text x="106" y="195" class="h">API Route</text><text x="82" y="218" class="b">transport + validation</text><text x="85" y="236" class="b">response coordination</text>
<rect class="box" x="300" y="145" width="230" height="125" rx="8"/><text x="335" y="175" class="h">Current-State Service</text><text x="325" y="200" class="b">rate-of-rise calculation</text><text x="325" y="220" class="b">assessment orchestration</text><text x="325" y="240" class="b">RiskStatus construction</text>
<rect class="box" x="610" y="105" width="200" height="85" rx="8"/><text x="650" y="135" class="h">Risk Engine</text><text x="630" y="158" class="b">threshold ratio + tier</text><text x="630" y="176" class="b">explainable current state</text>
<rect class="box" x="610" y="265" width="200" height="85" rx="8"/><text x="650" y="295" class="h">Legacy ML Model</text><text x="628" y="318" class="b">simulator-only probability</text><text x="634" y="336" class="b">development evidence</text>
<rect class="box" x="895" y="145" width="220" height="125" rx="8"/><text x="930" y="175" class="h">Telemetry Repository / DB</text><text x="923" y="200" class="b">current + previous readings</text><text x="930" y="220" class="b">station/source boundary</text><text x="935" y="240" class="b">persistent evidence</text>
<path class="line" d="M235 207 H300"/><path class="line" d="M530 180 H610"/><path class="line dash" d="M530 235 H570 V307 H610"/><path class="line" d="M895 207 H850 V207 H530"/><text x="548" y="168" class="b">classify current state</text><text x="545" y="292" class="b">simulated only</text><text x="35" y="455" class="b">Scientific boundary: ML probability is never numerically merged with threshold ratio and is not applied to hardware observations.</text></svg>