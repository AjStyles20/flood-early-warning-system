<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.pass{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.reject{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Station Coordinate Integrity</text>
<rect class="box" x="55" y="95" width="245" height="125" rx="8"/><text x="100" y="125" class="h">Station Coordinates</text><text x="92" y="155" class="b">latitude</text><text x="92" y="177" class="b">longitude</text><text x="92" y="199" class="b">normalized station metadata</text>
<rect class="pass" x="390" y="75" width="275" height="145" rx="8"/><text x="440" y="105" class="h">Database Bounds</text><text x="430" y="135" class="b">−90 ≤ latitude ≤ 90</text><text x="430" y="157" class="b">−180 ≤ longitude ≤ 180</text><text x="430" y="179" class="b">boundary values accepted</text><text x="430" y="201" class="b">SQLite + MySQL schema</text>
<rect class="reject" x="755" y="95" width="210" height="125" rx="8"/><text x="795" y="125" class="h">Invalid Metadata</text><text x="790" y="155" class="b">lat 90.0001</text><text x="790" y="177" class="b">lon −180.0001</text><text x="790" y="199" class="b">REJECTED</text>
<path class="line" d="M300 157 H390"/><path class="line" d="M665 157 H755"/>
<rect class="pass" x="390" y="325" width="775" height="80" rx="8"/><text x="430" y="355" class="h">Integrity meaning</text><text x="430" y="380" class="b">The constraint proves coordinate-domain validity only. It does not prove that a valid coordinate is the correct surveyed or authoritative location of a station.</text>
<text x="35" y="460" class="b">Database CHECK constraints complement API validation by protecting writes from scripts, imports and future repository paths.</text></svg>