<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font-family:Arial,sans-serif;fill:#17202a}.t{font-size:18px;font-weight:bold}.h{font-size:13px;font-weight:bold}.b{font-size:11px}.box{fill:#fff;stroke:#34495e;stroke-width:2}.pass{fill:#f8f9f9;stroke:#34495e;stroke-width:2}.reject{fill:#fff;stroke:#7b241c;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#566573;stroke-width:2;fill:none}</style><text x="35" y="35" class="t">FloodWatch Temporal Metadata Integrity</text>
<rect class="box" x="55" y="90" width="260" height="135" rx="8"/><text x="105" y="120" class="h">Dataset Metadata</text><text x="90" y="150" class="b">coverage_start ≤ coverage_end</text><text x="90" y="172" class="b">controlled evidence_type</text><text x="90" y="194" class="b">nullable open/unknown bounds allowed</text>
<rect class="box" x="390" y="90" width="260" height="135" rx="8"/><text x="440" y="120" class="h">Threshold Metadata</text><text x="425" y="150" class="b">valid_from ≤ valid_to</text><text x="425" y="172" class="b">open-ended validity allowed</text><text x="425" y="194" class="b">typed threshold constraint retained</text>
<rect class="pass" x="735" y="100" width="205" height="115" rx="8"/><text x="770" y="130" class="h">Database Guard</text><text x="765" y="160" class="b">SQLite test</text><text x="765" y="182" class="b">MySQL integration</text><text x="765" y="204" class="b">PASS</text>
<rect class="reject" x="1010" y="105" width="160" height="105" rx="8"/><text x="1040" y="135" class="h">Invalid State</text><text x="1028" y="165" class="b">end before start</text><text x="1042" y="187" class="b">REJECTED</text>
<path class="line" d="M315 157 H390"/><path class="line" d="M650 157 H735"/><path class="line" d="M940 157 H1010"/>
<rect class="pass" x="390" y="330" width="780" height="75" rx="8"/><text x="430" y="360" class="h">Why it matters</text><text x="430" y="385" class="b">Historical provenance and threshold applicability cannot be trusted if their own validity/coverage intervals are internally impossible.</text>
<text x="35" y="460" class="b">Interval consistency validates metadata structure; it does not independently verify a dataset provider's stated coverage or a threshold's authority.</text></svg>