name: FloodWatch CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r files/api/requirements-dev.txt
      - name: Compile Python and check JavaScript
        run: |
          python -m compileall -q files/api files/flood_sensor_simulator.py
          for script in files/api/static/js/*.js; do node --check "$script"; done
          node files/api/test_frontend.cjs
      - name: Regression and contract tests
        working-directory: files/api
        run: |
          python -u test_model_training.py
          python -u test_telemetry_repository.py
          python -u test_normalized_schema.py
          python -u test_observation_repository.py
          python -u test_telemetry_dual_write.py
          python -u test_normalized_read_parity.py
          python -u test_threshold_repository.py
          python -u test_current_state_parity.py
          python -u test_risk_status_promotion.py
          python -u test_telemetry_service.py
          python -u test_scenario_normalized_path.py
          python -u test_normalized_operational_consumers.py
          python -u test_normalized_telemetry_history.py
          python -u test_legacy_telemetry_dependency_guard.py
          python -u test_db5_readiness.py
          python -u test_station_coordinates.py
          python -u test_current_state_service.py
          python -u test_alert_service.py
          python -u test_api.py
          python -u test_operational.py
          python -u test_http_smoke.py
      - name: Start service and check HTTP health
        working-directory: files/api
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8050 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if python -c "import json, urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8050/health', timeout=5)); assert p['status']=='ok' and p['database']=='ok'"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build container
        run: docker build -t floodwatch:test .
      - name: Verify container health
        run: |
          docker run -d --name floodwatch-ci floodwatch:test
          trap 'docker logs floodwatch-ci; docker rm -f floodwatch-ci' EXIT
          for attempt in $(seq 1 40); do
            state=$(docker inspect --format '{{.State.Health.Status}}' floodwatch-ci)
            if [ "$state" = healthy ]; then exit 0; fi
            sleep 3
          done
          exit 1


  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: floodwatch_ci
          MYSQL_USER: floodwatch_ci
          MYSQL_PASSWORD: floodwatch_ci_password
          MYSQL_ROOT_PASSWORD: floodwatch_root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ufloodwatch_ci -pfloodwatch_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      FLOOD_EWS_DATABASE_URL: mysql+pymysql://floodwatch_ci:floodwatch_ci_password@127.0.0.1:3306/floodwatch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r files/api/requirements-dev.txt
      - name: Run MySQL DB-1 integration gate
        working-directory: files/api
        run: python -u test_mysql_integration.py
